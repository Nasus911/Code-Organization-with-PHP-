<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create an Marco Rafaeles portfolio account.">
  <title>Register | Marco Rafaeles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <header class="auth-header"><a class="brand-mark" href="index.html" aria-label="Marco Rafaeles home">MR<span>.</span></a><a class="back-link" href="index.html"><span aria-hidden="true">&larr;</span> Back to portfolio</a></header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="register-title">
      <p class="eyebrow">Join the portfolio</p>
      <h1 id="register-title">Create your account.</h1>
      <p class="auth-intro">Save your favorite projects and stay close to new work.</p>
      <form action="#" method="post">
        <div class="form-field"><label for="register-name">Full name</label><input type="text" id="register-name" name="full_name" autocomplete="name" required></div>
        <div class="form-field"><label for="register-email">Email address</label><input type="email" id="register-email" name="email" autocomplete="email" required></div>
        <div class="form-field"><label for="register-password">Password</label><input type="password" id="register-password" name="password" minlength="8" autocomplete="new-password" required><small>Use at least 8 characters.</small></div>
        <div class="form-field"><label for="confirm-password">Confirm password</label><input type="password" id="confirm-password" name="confirm_password" minlength="8" autocomplete="new-password" required></div>
        <div class="form-check custom-check"><input class="form-check-input" type="checkbox" id="terms" name="terms" required><label class="form-check-label" for="terms">I agree to the <a href="#">terms and conditions</a>.</label></div>
        <button class="btn btn-primary-custom w-100 auth-submit" type="submit">Create account <span aria-hidden="true">&#8594;</span></button>
      </form>
      <p class="switch-auth">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
  <footer class="auth-footer"><p>&copy; 2026 Marco Rafaeles</p></footer>
</body>
</html>
